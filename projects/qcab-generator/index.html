<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC Mains PYQs QCAB Generator</title>
<link rel="stylesheet" href="./style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<h1>UPSC Mains PYQs QCAB Generator</h1>

<div class="filter-mode">
    <label><input type="radio" name="mode" value="year-gs" checked> Year + GS Paper</label>
    <label><input type="radio" name="mode" value="gs-syllabus"> GS Paper + Syllabus Topic</label>
</div>

<div id="filters"></div>

<div id="selectedSummary" style="margin-bottom:10px; display:none;">
    Selected Questions: <span id="selectedCount">0</span>, Total Marks: <span id="totalMarks">0</span>,
    10-mark: <span id="count10">0</span>, 15-mark: <span id="count15">0</span>
</div>

<table id="questionsTable">
    <thead>
        <tr>
            <th><input type="checkbox" id="selectAll"></th>
            <th>Year</th>
            <th>GS Paper</th>
            <th>Question Text</th>
            <th>Marks</th>
            <th>Word Limit</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="buttons">
    <button id="generateQCAB">Generate QCAB PDF</button>
    <button id="downloadPDF" style="display:none;">Download QCAB PDF</button>
</div>

<script src="./js/populateQuestions.js"></script>
<script src="./js/generatePDF.js"></script>
</body>
</html>
