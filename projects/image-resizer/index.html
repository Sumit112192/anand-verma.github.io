<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Resizer | Creations - Anand Verma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Resize and compress photos for UPSC and custom exam requirements. Private, fast, modern. By Anand Verma." />
    <link rel="stylesheet" href="style.css" />
  </head>
<body>
  <main class="container">
    <header>
      <h1>Image Resizer</h1>
      <p>Resize any photo for UPSC or Custom requirements. 100% private, runs in your browser.</p>
    </header>
    <section id="form-section">
      <div class="card">
        <div class="mode-switch">
          <button id="mode-upsc" class="mode-btn active">UPSC</button>
          <button id="mode-custom" class="mode-btn">Custom</button>
        </div>
        <div id="requirements" class="requirements">
          <ul>
            <li><strong>UPSC Spec:</strong> JPG format</li>
            <li>Dimensions: <b>350×350 px</b> <i>up to</i> <b>1000×1000 px</b></li>
            <li>File size: 20 KB to 300 KB</li>
          </ul>
        </div>
        <form id="custom-fields" class="hidden">
          <div class="form-row">
            <label for="custom-min-width">Min Width</label>
            <input type="number" id="custom-min-width" min="1" value="350" placeholder="Min width (px)">
          </div>
          <div class="form-row">
            <label for="custom-max-width">Max Width</label>
            <input type="number" id="custom-max-width" min="1" value="1000" placeholder="Max width (px)">
          </div>
          <div class="form-row">
            <label for="custom-min-height">Min Height</label>
            <input type="number" id="custom-min-height" min="1" value="350" placeholder="Min height (px)">
          </div>
          <div class="form-row">
            <label for="custom-max-height">Max Height</label>
            <input type="number" id="custom-max-height" min="1" value="1000" placeholder="Max height (px)">
          </div>
          <div class="form-row">
            <label for="custom-format">Format</label>
            <select id="custom-format">
              <option value="jpg">JPG</option>
              <option value="png">PNG</option>
            </select>
          </div>
          <div class="form-row">
            <label for="custom-min-size">Min Size (KB)</label>
            <input type="number" id="custom-min-size" min="1" value="20" placeholder="Min KB">
          </div>
          <div class="form-row">
            <label for="custom-max-size">Max Size (KB)</label>
            <input type="number" id="custom-max-size" min="10" value="300" placeholder="Max KB">
          </div>
        </form>
        <div class="form-row file-row">
          <label for="file-input" class="upload-label">
            <span>Upload Photo</span>
            <input type="file" id="file-input" accept="image/jpeg,image/png" />
          </label>
        </div>
        <div id="error-msg" class="error-msg"></div>
      </div>
    </section>
    <section id="result-section" class="hidden">
      <div class="card preview-card">
        <h2>Preview</h2>
        <div class="preview-images">
          <div>
            <p>Original</p>
            <img id="original-preview" alt="Original preview" src="" class="preview-img"/>
            <div id="original-meta"></div>
          </div>
          <div>
            <p>Resized</p>
            <img id="result-preview" alt="Resized preview" src="" class="preview-img"/>
            <div id="result-meta"></div>
          </div>
        </div>
        <div class="result-info" id="result-info"></div>
        <button id="download-btn" class="main-btn">Download Image</button>
        <button id="start-over-btn" class="secondary-btn">Start Over</button>
      </div>
    </section>
    <footer>
      <small>&copy; 2025. All local, privacy safe.</small>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
